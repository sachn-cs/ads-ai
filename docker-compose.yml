services:
  cinestudio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 26-alpine
        PNPM_VERSION: 9
    image: cinestudio:local
    container_name: cinestudio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CINESTUDIO_DATA_DIR: /data
      CINESTUDIO_ARTIFACT_DIR: /artifacts
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - cinestudio_data:/data
      - cinestudio_artifacts:/artifacts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  cinestudio_data:
    name: cinestudio_data
  cinestudio_artifacts:
    name: cinestudio_artifacts
