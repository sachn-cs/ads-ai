repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=4096]
      - id: check-merge-conflict
      - id: check-json
      - id: debug-statements

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        language: system

  - repo: local
    hooks:
      - id: lint
        name: ESLint
        entry: pnpm lint
        language: system
        pass_filenames: false
        types: [ts, tsx, javascript]
      - id: typecheck
        name: TypeScript check
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        types: [ts, tsx]
